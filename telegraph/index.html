<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1118" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Telegraph</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 3h16l8 13-8 13H8L0 16z' fill='%23232838'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%235ee7ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />
    <link rel="stylesheet" href="../src/telegraph/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Depth</span><span id="depth" class="value">1</span></div>
        <div id="hearts" aria-label="Health"></div>
        <div class="stat"><span class="label">Bash</span><span id="bash" class="value">✓</span></div>
        <div class="stat"><span class="label">Kills</span><span id="kills" class="value">0</span></div>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <main id="stage"><canvas id="board"></canvas></main>
      <footer id="panel">
        <div id="info"></div>
        <button id="actBtn" class="primary" hidden></button>
      </footer>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/telegraph/main.ts"></script>
  </body>
</html>
