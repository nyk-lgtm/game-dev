<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#05010f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Nightline</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2305010f'/%3E%3Cpath d='M4 28 L14 12 L18 12 L28 28Z' fill='%234a4a62'/%3E%3Cpath d='M15.5 14h1v4h-1zM15.3 21h1.4v5h-1.4z' fill='%2305d9e8'/%3E%3Ccircle cx='16' cy='8' r='5' fill='%23ff2a6d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/nightline/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" hidden>
      <div id="top">
        <div class="cell"><span class="label">Speed</span><span id="speed">0</span></div>
        <div class="cell time"><span class="label">Time</span><span id="clock">60</span></div>
        <div class="cell"><span class="label">Score</span><span id="score">0</span></div>
      </div>
      <div id="stage"><span id="stageName">NEON CITY</span><div id="prog"><i id="progFill"></i></div></div>
      <div id="flash"></div>
      <button id="pauseBtn" aria-label="Pause">||</button>
      <div id="controls">
        <button id="brakeBtn">BRAKE</button>
        <div id="nitro"><i id="nitroFill"></i></div>
        <button id="boostBtn">BOOST</button>
      </div>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/nightline/main.ts"></script>
  </body>
</html>
