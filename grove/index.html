<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10140f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Grove</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M8 3h16l8 13-8 13H8L0 16z' fill='%231f261c'/%3E%3Ccircle cx='16' cy='13' r='7' fill='%235fbf55'/%3E%3Crect x='14.5' y='17' width='3' height='8' fill='%237a5636'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />
    <link rel="stylesheet" href="../src/grove/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">Best</span><span id="best" class="value">0</span></div>
        <div class="spacer"></div>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <main id="stage"><canvas id="board"></canvas></main>
      <footer id="tray">
        <div id="info"></div>
        <div id="slots">
          <button id="stashBtn" class="slot" aria-label="Stash"><canvas id="stashCanvas"></canvas><span class="label">Stash</span></button>
          <div class="slot current"><canvas id="curCanvas"></canvas><span class="label" id="curLabel">Place</span></div>
          <div class="slot next"><canvas id="nextCanvas"></canvas><span class="label">Next</span></div>
          <button id="actBtn" class="primary" hidden></button>
        </div>
      </footer>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/grove/main.ts"></script>
  </body>
</html>
