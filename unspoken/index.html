<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efe6d2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Unspoken</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23efe6d2'/%3E%3Cpath d='M9 9h14M16 9v8M10 23c3-5 9-5 12 0' stroke='%232b2118' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />

  <body>
    <div id="app">
      <header id="hud">
        <div id="langBox"><span id="langName">Language</span><span id="words">0 of 0 glyphs read</span><i id="wordsBar"><b></b></i></div>
        <button id="notebookBtn" class="icon-btn" aria-label="Notebook">✎</button>

      <div id="placesBar"><nav id="places"></nav></div>
      <main id="main"><div id="page"></div></main>
      <footer id="pager">
        <button id="prevBtn" class="pg" aria-label="Previous page">‹</button>
        <div id="dots"></div>
        <button id="nextBtn" class="pg" aria-label="Next page">›</button>
      </footer>
    </div>
    <div id="sheet" hidden></div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/unspoken/main.ts"></script>
