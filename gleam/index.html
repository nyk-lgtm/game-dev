<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Gleam</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d18'/%3E%3Cpath d='M3 10H16L16 27' stroke='%23ff4f5e' stroke-width='2.5' fill='none'/%3E%3Cpath d='M29 16H16' stroke='%235b8cff' stroke-width='2.5'/%3E%3Cpath d='M16 6l6 4-3 7h-6l-3-7z' fill='%23ff5cf0'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />
    <link rel="stylesheet" href="../src/gleam/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span id="levelLabel" class="label">Small</span><span id="lit" class="value">0/0</span></div>
        <div class="stat"><span class="label">Time</span><span id="clock" class="value">0:00</span></div>
        <div class="spacer"></div>
        <button id="helpBtn" class="icon-btn" aria-label="How to play">?</button>
        <button id="newBtn" class="icon-btn" aria-label="New puzzle">＋</button>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <main id="stage"><canvas id="board"></canvas></main>
      <section id="controls">
        <div id="info"></div>
        <div id="tray"></div>
        <div id="tools">
          <button id="undoBtn" class="tool">↶ Undo</button>
          <button id="resetBtn" class="tool">⟲ Clear</button>
          <button id="hintBtn" class="tool">💡 Hint</button>
        </div>
      </section>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/gleam/main.ts"></script>
  </body>
</html>
