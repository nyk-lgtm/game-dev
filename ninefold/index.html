<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c1613" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Ninefold</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f8a50'/%3E%3Ccircle cx='16' cy='22' r='4' fill='%230a0d0b'/%3E%3Cpath d='M16 22V6' stroke='%23e8e2d0' stroke-width='1.6'/%3E%3Cpath d='M16 6l9 3-9 3z' fill='%23ff5a4e'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />
    <link rel="stylesheet" href="../src/ninefold/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Hole</span><span id="holeNo" class="value">1/9</span></div>
        <div class="stat"><span class="label">Par</span><span id="par" class="value">3</span></div>
        <div class="stat"><span class="label">Shots</span><span id="shots" class="value">0</span></div>
        <div class="stat"><span class="label">Total</span><span id="total" class="value">E</span></div>
        <span id="dailyTag" hidden>Daily</span>
        <div class="spacer"></div>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <main id="stage"><canvas id="board"></canvas></main>
      <section id="controls">
        <div id="info"></div>
        <button id="cardBtn">Scorecard</button>
      </section>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/ninefold/main.ts"></script>
  </body>
</html>
