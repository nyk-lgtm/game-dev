<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#16131a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Quarry</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a2230'/%3E%3Cpath d='M9 4h14l7 12-7 12H9L2 16z' fill='%23efe2c4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='16' fill='%232a2230'%3EQ%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="../src/shared/shell.css" />
    <link rel="stylesheet" href="../src/quarry/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span class="label">Depth</span><span id="depthNo" class="value">1/8</span></div>
        <div class="stat"><span class="label">Words</span><span id="wordsLeft" class="value">7</span></div>
        <div class="stat"><span class="label">Score</span><span id="score" class="value">0</span></div>
        <span id="dailyTag" hidden>Daily</span>
        <div class="spacer"></div>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <div id="goal">
        <div id="goalTop"><span id="layer">Topsoil</span><span id="goalText">0 / 90</span></div>
        <div id="bar"><i id="barFill"></i><i id="barPrev"></i></div>
      </div>
      <div id="wordBox"><div id="word"></div><div id="wordSub"></div></div>
      <main id="stage">
        <div id="board"></div>
        <svg id="trail"><polyline id="trailLine" points="" /></svg>
        <div id="banner" hidden></div>
      </main>
      <section id="dock">
        <div id="perkBar"></div>
        <div id="tools">
          <button id="pickBtn" class="tool" hidden aria-label="Pickaxe">⛏️ <span id="pickN">1</span></button>
          <button id="shakeBtn" class="tool" aria-label="Shake">🌀 Shake <span id="shakeN">1</span></button>
        </div>
      </section>
    </div>
    <div id="fx"></div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
    <script type="module" src="../src/quarry/main.ts"></script>
  </body>
</html>
