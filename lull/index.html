<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121c24" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Lull</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314202a'/%3E%3Cpath d='M0 22h32v10H0z' fill='%235a8f50'/%3E%3Cpath d='M12 22c0-7 2-11 7-13' stroke='%2378b46a' stroke-width='1.6' fill='none'/%3E%3Cpath d='M17 9l-3 1 1 5 4-1z' fill='%23b7a4ff'/%3E%3Ccircle cx='24' cy='8' r='3' fill='%23fff6d8'/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="../assets/lull-zZdd9dFE.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/storage-20bEmBCf.js">
    <link rel="modulepreload" crossorigin href="../assets/cards-C2W5ZOxE.js">
    <link rel="modulepreload" crossorigin href="../assets/rng-Dkl72p5S.js">
    <link rel="modulepreload" crossorigin href="../assets/daily-B7bh9VBh.js">
    <link rel="stylesheet" crossorigin href="../assets/lull-bvh5r3ly.css">
    <link rel="stylesheet" crossorigin href="../assets/shell-Dcmhcd0y.css">
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stat"><span id="dayLabel" class="label">Day 1</span><span id="phase" class="value">☀️ Day</span></div>
        <button id="wishBtn" class="icon-btn wide" aria-label="Wishes">★</button>
        <script>
          // The saved count at once (the module loads a moment later; it showed 0 meanwhile).
          try {
            var s = JSON.parse(localStorage.getItem('lull.garden') || 'null');
            var p = JSON.parse(localStorage.getItem('lull.profile') || 'null');
            var d = new Date(), day = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            if (s && s.w && s.w.done) document.getElementById('wishBtn').textContent = '★ ' + s.w.done.length + (p && p.daily && p.daily.day === day && p.daily.done ? ' ✓' : '');
          } catch (e) {}
        </script>
        <button id="soundBtn" class="icon-btn" aria-label="Sound on or off">🔊</button>
        <button id="helpBtn" class="icon-btn" aria-label="How to play">?</button>
        <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
      </header>
      <main id="stage"><canvas id="land"></canvas><canvas id="board"></canvas><div id="listen" hidden><span>🔈</span> Tap the garden to listen</div></main>
      <section id="controls">
        <div id="info"></div>
        <div id="species"></div>
        <div id="tools">
          <button id="tool-seed" class="tool"><span>🌱</span>Plant</button>
          <button id="tool-water" class="tool"><span>💧</span>Water</button>
          <button id="tool-strum" class="tool"><span>🎐</span>Strum</button>
          <button id="tool-dig" class="tool"><span>🪏</span>Dig</button>
          <button id="undoBtn" class="tool undo" aria-label="Undo"><span>↶</span>Undo</button>
        </div>
      </section>
    </div>
    <div id="overlay" hidden></div>
    <div id="errors"></div>
  </body>
</html>
